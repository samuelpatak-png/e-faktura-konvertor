name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, test, Peppol validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Prisma client
        run: npm run --workspace backend prisma:generate

      - name: Lint
        run: npm run --workspace backend lint

      - name: Typecheck
        run: npm run --workspace backend typecheck

      - name: Unit tests
        run: npm run --workspace backend test

      - name: Set up Java (for the official KOSIT/Peppol validator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache KOSIT validator + Peppol Schematron rules
        uses: actions/cache@v4
        with:
          path: backend/tools/kosit
          key: kosit-tools-${{ hashFiles('backend/scripts/setup-kosit.sh') }}

      - name: Validate sample invoices against official EN16931/Peppol BIS 3.0 rules
        run: npm run --workspace backend validate:fixtures

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run --workspace frontend lint

      - name: Typecheck + build
        run: npm run --workspace frontend build
